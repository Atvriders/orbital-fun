name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-gravity-orbital-game-0ltpmh
    paths:
      - 'core/**'
      - 'android/**'
      - 'lwjgl3/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run core tests
        run: ./gradlew core:test --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew android:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: orbital-fun-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
